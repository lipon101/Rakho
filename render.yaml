services:
  - type: web
    name: rakho-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py makemigrations --noinput && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/v1/health/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bangladesh-pharmacy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,rakho-api.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        sync: false
      - key: SETUP_TOKEN
        generateValue: true
      # Google Play purchase verification. The package name is fixed; the
      # service-account JSON is entered in the dashboard (leave empty to keep
      # subscriptions disabled — the app then stays on the free plan).
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: bd.rakho.pharmacy
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false

databases:
  - name: bangladesh-pharmacy-db
    plan: free
    databaseName: pharmacy
    user: pharmacy
