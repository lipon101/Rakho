services:
  - type: web
    name: rakho-api
    runtime: python
    plan: free
    rootDir: backend
    # Migrations are authored in the repo and applied idempotently, so a build
    # can never fail on an already-initialized database. No makemigrations on
    # the server --- that would create migrations that were never reviewed.
    buildCommand: pip install -r requirements.txt && python manage.py deploy_preflight && python manage.py collectstatic --noinput && python migrate_prod.py
    # The entrypoint script, not gunicorn directly: it clears and creates
    # PROMETHEUS_MULTIPROC_DIR before the workers start. Stale files left there
    # by a previous boot are replayed as live metrics, so a scrape would report
    # yesterday's traffic alongside today's and the p95 would never reset.
    startCommand: bash scripts/gunicorn_entrypoint.sh
    # Readiness rather than liveness: a container whose database is unreachable
    # is alive and useless, and pointing traffic at it guarantees an error page.
    healthCheckPath: /api/v1/ready/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bangladesh-pharmacy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,rakho-api.onrender.com
      - key: SITE_URL
        value: https://rakho-api.onrender.com
      # Redis is mandatory in production: it backs the shared cache, the DRF
      # throttles (per-process counters would multiply every rate limit by the
      # worker count) and the Celery broker.
      - key: REDIS_URL
        fromService:
          type: redis
          name: rakho-redis
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SETUP_TOKEN
        generateValue: true
      # Google Play purchase verification. The package name is fixed; the
      # service-account JSON is entered in the dashboard (leave empty to keep
      # subscriptions disabled --- the app then stays on the free plan).
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.lipon.rakho
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      # Play link for the landing page's install button, e.g.
      # https://play.google.com/store/apps/details?id=com.lipon.rakho
      # A closed test link works too: https://play.google.com/apps/testing/com.lipon.rakho
      # Left empty, the install band offers the free API key instead --- it never
      # ships a download button before there is somewhere real to send people.
      - key: PLAY_STORE_URL
        sync: false
      # Error reporting and the guard token for the public setup endpoints.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      # Phase 6 observability. METRICS_TOKEN is what makes /api/v1/metrics/
      # reachable at all: with no token configured the endpoint returns 404, so
      # a forgotten value removes it rather than exposing the route table.
      # PROMETHEUS_MULTIPROC_DIR is required for correct numbers under gunicorn's
      # multiple workers (see scripts/gunicorn_entrypoint.sh).
      - key: METRICS_TOKEN
        generateValue: true
      - key: PROMETHEUS_MULTIPROC_DIR
        value: /tmp/prometheus
      - key: MEDIA_S3_BUCKET
        sync: false
      - key: MEDIA_S3_ACCESS_KEY
        sync: false
      - key: MEDIA_S3_SECRET_KEY
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Rakho <no-reply@rakho.app>
      # B2B pricing (M5). Integers in BDT so invoice arithmetic stays exact.
      - key: BRANCH_PRICE_BDT
        value: "1499"
      - key: SEAT_PRICE_BDT
        value: "199"
      - key: INCLUDED_SEATS_PER_BRANCH
        value: "3"
      - key: VAT_PERCENT
        value: "15"
      - key: ORG_TRIAL_DAYS
        value: "14"

  # The background worker. It shares the web service's image and environment, so
  # a task always runs against the same code and the same settings the API used
  # to enqueue it.
  - type: worker
    name: rakho-worker
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --concurrency 2 rather than the CPU count: on the free plan the worker
    # shares a small instance, and a fan-out of prefetched tasks against one
    # small Postgres connection pool is the more common way a free tier falls
    # over. -O fair keeps one long export from starving the expiry digest.
    startCommand: celery -A config worker --loglevel=info --concurrency=2 -O fair
    envVars:
      - fromGroup: rakho-shared

  # Beat is a scheduler, not a worker: it only enqueues. It must never run more
  # than once, or every scheduled task fires twice.
  - type: worker
    name: rakho-beat
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - fromGroup: rakho-shared

  - type: redis
    name: rakho-redis
    plan: free
    ipAllowList: []

envVarGroups:
  # Shared by both Celery services so the worker and the scheduler can never
  # drift from each other or from the API.
  - name: rakho-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bangladesh-pharmacy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rakho-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,rakho-api.onrender.com
      - key: SITE_URL
        value: https://rakho-api.onrender.com
      # Row-Level Security (M6). Off until the rollout in the RLS runbook is
      # complete: the migration is additive and harmless, but the role switch is
      # the step that makes it enforced, and that step is deliberate.
      - key: RLS_ENABLED
        value: "false"
      # These services DO run Celery, so unlike the web service they should fail
      # readiness when nothing is consuming the queue.
      - key: CELERY_REQUIRE_WORKER
        value: "true"
      # The same metrics token as the web service, so a scrape can read the
      # worker's gauges (queue depth in particular) from the same endpoint.
      - key: METRICS_TOKEN
        sync: false

databases:
  - name: bangladesh-pharmacy-db
    plan: free
    databaseName: pharmacy
    user: pharmacy
