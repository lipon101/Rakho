services:
  - type: web
    name: rakho-api
    runtime: python
    plan: free
    rootDir: backend
    # Migrations are authored in the repo and applied idempotently, so a build
    # can never fail on an already-initialized database. No makemigrations on
    # the server — that would create migrations that were never reviewed.
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python migrate_prod.py
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/v1/health/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bangladesh-pharmacy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1,rakho-api.onrender.com
      - key: CORS_ALLOW_ALL_ORIGINS
        sync: false
      - key: SETUP_TOKEN
        generateValue: true
      # Google Play purchase verification. The package name is fixed; the
      # service-account JSON is entered in the dashboard (leave empty to keep
      # subscriptions disabled — the app then stays on the free plan).
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.lipon.rakho
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      # Public Play listing, e.g.
      # https://play.google.com/store/apps/details?id=com.lipon.rakho — the
      # landing page shows its install section only when this is set, so the
      # page never ships a download button before the app is published.
      - key: PLAY_STORE_URL
        sync: false

databases:
  - name: bangladesh-pharmacy-db
    plan: free
    databaseName: pharmacy
    user: pharmacy
