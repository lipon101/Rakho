name: CI

# The 185-test suite existed but nothing ran it: the only workflow pinged a
# Render deploy hook, so a push could ship a regression straight to production.
# This workflow is the missing gate --- it runs the tests, the linter, the
# formatter and the production settings check on every push and pull request.
#
# Two details are deliberate rather than incidental:
#
# * ``DJANGO_SETTINGS_MODULE`` is set explicitly per step instead of left to the
#   runner's default. The test steps want ``local`` (the production module
#   refuses to import without real secrets, so a test run under it would fail at
#   import and say nothing about the code). The ``check --deploy`` step wants
#   ``production``, because that is the configuration whose mistakes it exists
#   to catch.
# * The Redis service exists for the readiness-probe test and for anything that
#   needs a real cache. Set ``REDIS_URL`` so the checks exercise a shared cache
#   rather than falling back to per-process memory, which would hide exactly the
#   multi-worker throttle bug the production settings guard against.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Tests
        # Run under coverage so the DoD's coverage gate can read the result from
        # the same execution. Running the suite twice --- once plain, once under
        # coverage --- would double the slowest step in CI for nothing.
        run: |
          coverage run --source=inventory,config manage.py test --verbosity=1
          coverage report --skip-covered --show-missing
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local

      - name: Coverage gate
        # The DoD sets the bar at 85%, and this is that bar. Set at the DoD
        # number rather than at a rounder, lower one so the gate means what the
        # Definition of Done says it means.
        #
        # Measured at the time of writing: 85%. That is no margin, and it is
        # stated plainly rather than dressed up: the next commit that adds an
        # uncovered branch will fail this gate, and that is the intended
        # behaviour --- the answer is to cover the new branch, not to lower the
        # number. The largest uncovered regions are the command modules'
        # subprocess paths (`backup_db`, `restore_drill`), which are exercised
        # for real by the documented drill rather than by a mock.
        run: coverage report --fail-under=85
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.local

      - name: Production settings check
        # Runs the hardened module on purpose: a wildcard CORS origin, a missing
        # host list or a placeholder secret fails the build here, in CI, instead
        # of failing a deploy or --- worse --- succeeding with a leak.
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0000000000000000
          DEBUG: "false"
          ALLOWED_HOSTS: ci.rakho.test
          SITE_URL: https://ci.rakho.test
          CORS_ALLOW_ALL_ORIGINS: "false"
          CORS_ALLOWED_ORIGINS: https://console.rakho.test
          REDIS_URL: redis://localhost:6379/0

      - name: Dependency audit
        # Not a gate: pip-audit reports what has actually been published, and a
        # new advisory should not block an unrelated pull request. It is here so
        # the log carries the finding.
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt || true

      - name: Generate SBOM
        # Emitted for *every* build, not only releases. An SBOM only answers
        # "what was in the build that shipped on this date" for builds that
        # produced one at the time; generating it later is not possible.
        run: python scripts/generate_sbom.py

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: rakho-sbom
          path: backend/sbom/rakho-backend.cdx.json
          retention-days: 90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakho-coverage
          path: |
            backend/.coverage
            backend/htmlcov
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android (build + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Check the Gradle wrapper is present
        # The app was removed from the public repository and restored from git
        # history; if the wrapper is ever lost again this step says so plainly
        # instead of letting the build fail with a confusing "no such file".
        run: |
          test -f gradlew || { echo "::error::android/gradlew is missing"; exit 1; }
          chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # ``packages`` is stated explicitly rather than left to the default.
          # The default used to be "tools platform-tools", and the ``tools``
          # package no longer exists in Google's SDK repository --- the
          # cmdline-tools replaced it. sdkmanager therefore exited 1 about
          # eighteen seconds in and this job failed at "Set up Android SDK",
          # before a single test ran, which is why the failure always came with
          # no test output at all. Asking for exactly what the build needs, and
          # nothing that has been retired, also makes the job faster.
          #
          # ``platforms;android-37.0`` is the versioned name API 37 is published
          # under --- there is no plain ``platforms;android-37``, and requesting
          # that is its own silent failure.
          packages: "platform-tools,platforms;android-37.0,build-tools;37.0.0"

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rakho-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
