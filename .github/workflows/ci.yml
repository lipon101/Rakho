name: CI

# The 185-test suite existed but nothing ran it: the only workflow pinged a
# Render deploy hook, so a push could ship a regression straight to production.
# This workflow is the missing gate — it runs the tests, the linter and the
# formatter check on every push and pull request, and it is a required check
# before the deploy workflow is allowed to fire.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Django system check
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-000000000000
          DEBUG: "false"

      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-000000000000

      - name: Tests
        run: python manage.py test --verbosity=2
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-000000000000
