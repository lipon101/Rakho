name: Android

# Builds and tests the Play Store app on every change.
#
# The workflow always runs unit tests and lint. It produces a *signed* Play
# bundle only when the release keystore is configured as repository secrets:
#   RAKHO_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
#   RAKHO_KEYSTORE_PASSWORD, RAKHO_KEY_ALIAS, RAKHO_KEY_PASSWORD
# Without them it still builds the (unsigned) release bundle, so a missing
# secret can never block development.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint (release)
        working-directory: android
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Decode upload keystore
        if: ${{ secrets.RAKHO_KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          echo "${{ secrets.RAKHO_KEYSTORE_BASE64 }}" | base64 -d > android/rakho-upload.jks

      - name: Build release bundle
        working-directory: android
        env:
          RAKHO_KEYSTORE_PATH: ${{ secrets.RAKHO_KEYSTORE_BASE64 != '' && 'rakho-upload.jks' || '' }}
          RAKHO_KEYSTORE_PASSWORD: ${{ secrets.RAKHO_KEYSTORE_PASSWORD }}
          RAKHO_KEY_ALIAS: ${{ secrets.RAKHO_KEY_ALIAS }}
          RAKHO_KEY_PASSWORD: ${{ secrets.RAKHO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: rakho-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up keystore
        if: always()
        run: rm -f android/rakho-upload.jks
