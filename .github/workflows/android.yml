name: Android

# Builds and tests the Play Store app on every change.
#
# The workflow always runs unit tests and lint. It produces a *signed* Play
# bundle only when the release keystore is configured as repository secrets:
#   RAKHO_KEYSTORE_BASE64  base64 of the upload keystore (.jks)
#   RAKHO_KEYSTORE_PASSWORD, RAKHO_KEY_ALIAS, RAKHO_KEY_PASSWORD
# Without them it still builds the (unsigned) release bundle, so a missing
# secret can never block development.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RAKHO_KEYSTORE_BASE64: ${{ secrets.RAKHO_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check if android directory exists
        id: check_android
        run: |
          if [ ! -d "android" ]; then
            echo "android directory is private and excluded from this repository. Skipping Android CI."
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Make the Gradle wrapper executable
        if: steps.check_android.outputs.skipped != 'true'
        working-directory: android
        run: chmod +x gradlew

      - name: Set up JDK 17
        if: steps.check_android.outputs.skipped != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.check_android.outputs.skipped != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"

      - name: Set up Gradle
        if: steps.check_android.outputs.skipped != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle dependencies
        if: steps.check_android.outputs.skipped != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        if: steps.check_android.outputs.skipped != 'true'
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint (release)
        if: steps.check_android.outputs.skipped != 'true'
        working-directory: android
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Decode upload keystore
        if: steps.check_android.outputs.skipped != 'true' && env.RAKHO_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$RAKHO_KEYSTORE_BASE64" | base64 -d > android/rakho-upload.jks

      - name: Build release bundle
        if: steps.check_android.outputs.skipped != 'true'
        working-directory: android
        env:
          RAKHO_KEYSTORE_PATH: ${{ env.RAKHO_KEYSTORE_BASE64 != '' && 'rakho-upload.jks' || '' }}
          RAKHO_KEYSTORE_PASSWORD: ${{ secrets.RAKHO_KEYSTORE_PASSWORD }}
          RAKHO_KEY_ALIAS: ${{ secrets.RAKHO_KEY_ALIAS }}
          RAKHO_KEY_PASSWORD: ${{ secrets.RAKHO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:bundleRelease

      - name: Upload Play bundle
        if: steps.check_android.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rakho-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always() && steps.check_android.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up keystore
        if: always() && steps.check_android.outputs.skipped != 'true'
        run: rm -f android/rakho-upload.jks
